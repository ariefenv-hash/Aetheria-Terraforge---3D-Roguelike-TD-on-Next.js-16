name: Deploy to GitHub Pages (Auto)

# This workflow is the recommended way to deploy to GitHub Pages automatically.
# It needs to be enabled manually the first time:
#
# 1. Go to: https://github.com/ariefenv-hash/Aetheria-Terraforge---3D-Roguelike-TD-on-Next.js-16/settings/pages
# 2. Under "Build and deployment" → "Source", select **GitHub Actions** (not "Deploy from a branch")
# 3. After this, every push to main will auto-deploy.
#
# Until that setting is changed, deployments will still use the "legacy" mode
# (auto-deploy from the gh-pages branch on each push). See download/CLOUDFLARE_DEPLOY.md
# for the manual gh-pages workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with GitHub Pages basePath
        env:
          GITHUB_PAGES_BASE: '/Aetheria-Terraforge---3D-Roguelike-TD-on-Next.js-16'
        run: bunx next build

      - name: Add .nojekyll (bypass Jekyll processing)
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
